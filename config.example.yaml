# Example Hermes config.yaml for OptMem memory provider
#
# Copy this to ~/.hermes/config.yaml (or your profile's config.yaml)
# and restart the gateway: `hermes gateway restart`

# ... your existing providers (openai, anthropic, etc.) ...

memory:
  provider: optmem
  enabled: true

# The shared setup uses the canonical memo command. On blooper this is an SSH
# shim to the VPS store; on the VPS it is the real memo executable. Do not set
# memory_dir when using memo-cli: that would create a profile-local fork.
plugins:
  optmem:
    backend: memo-cli
    memo_command: ~/.optmem/memo
    shared_store: true
    memo_timeout: 30

# For a standalone local store instead:
# plugins:
#   optmem:
#     backend: local
#     memory_dir: "$HERMES_HOME/optmem_memory"

# --- Optional OptMem-specific settings ---
# Auto-compaction: the plugin compresses old memory blocks every ~10 turns.
# Default: deterministic, LLM-free summary (zero token cost, works offline).
# Set llm_summary: true to let the host LLM write a more fluent summary.
# plugins:
#   optmem:
#     llm_summary: true

toolsets:
  - hermes-cli
  # add your other toolsets

agent:
  max_turns: 100
  # your other agent settings
