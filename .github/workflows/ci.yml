# GitHub Actions CI for OptMem Hermes Plugin

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Verify engine compiles
        run: python -m py_compile optmem/engine.py optmem/__init__.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lint deps
        run: pip install ruff
      - name: Run ruff
        run: ruff check optmem/ tests/

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .[dev]
      - name: Run tests (Windows)
        run: python -m pytest tests/ -q
      - name: Verify Windows locking compiles
        run: python -m py_compile optmem/engine.py optmem/__init__.py
